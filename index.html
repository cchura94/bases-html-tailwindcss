        let carrito = [];
        function agregarCarrito(prod){
            console.log(prod);
            carrito.push({id: prod.id, nombre: prod.nombre, precio: prod.precio, cantidad: 1, imagen: prod.imagen});
            actualizarCarrito();
            document.getElementById('carrito-toggle').checked = true;
        }

        let carritoHtml = "";
        function actualizarCarrito(){
            carritoHtml = carrito.map(item => `
            <div class="flex items-center justify-between gap-4 bg-slate-50 p-3 rounded-md border border-slate-500">
                <img src="${item.imagen}" alt="" class="w-14 h-14 object-cover rounded shadow-md">
                <div class="flex-1">
                    <h4 class="font-semibold text-slate-800">${item.nombre}</h4>
                    <span class="text-indigo-600 font-medium text-xs">${item.precio} USDT</span>
                </div>
                <div>
                    <span>precio</span>
                </div>
            </div>
            `).join('');

            document.getElementById("carrito-items").innerHTML = carritoHtml;
        }

        function hablarWhatsapp() {
            let mensaje = '';
            carrito.forEach(item => {
                mensaje += `- *${item.nombre}* x${item.cantidad} - $${item.precio}`
            })
            window.open(`https://wa.me/59173277937?text=Hola+Quiero+comprar+${mensaje}`);
        }
